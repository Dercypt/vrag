[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vrag"
version = "0.1.0"
description = "Comparative benchmarking harness for reducing hallucinations in lightweight open-source LLMs using a Verification-Driven RAG pipeline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.23.0",
    "pysbd>=0.3.4",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.7.4",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.38.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
vrag = "vrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "law: Non-negotiable domain invariant tests enforcing LAWS.md",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
